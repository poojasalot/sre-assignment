apiVersion: v1
kind: Service
metadata:
  name: go-service
  namespace: sre-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
spec:
  selector: {app: go-token-service}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc, appProtocol: grpc}
    - {name: metrics, port: 9090, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-token-service
  namespace: sre-platform
spec:
  # Replica count is owned by the HorizontalPodAutoscaler (minReplicas is set per overlay).
  selector:
    matchLabels: {app: go-token-service}
  template:
    metadata:
      labels: {app: go-token-service}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: go-service
          image: ghcr.io/your-org/sre-go-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: metrics, containerPort: 9090}
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: REDIS_PASSWORD}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 750m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: go-token-service}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: go-token-service}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - {key: app, operator: In, values: [go-token-service]}

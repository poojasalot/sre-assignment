apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sre-platform
spec:
  clusterIP: None
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sre-platform
spec:
  serviceName: redis
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: redis}
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "-ec"]
          args:
            - |
              master_host="redis-0.redis"
              for i in $(seq 1 30); do
                discovered="$(redis-cli -h redis-sentinel-0.redis-sentinel -p 26379 --raw sentinel get-master-addr-by-name mymaster 2>/dev/null | sed -n '1p')"
                if [ -n "$discovered" ]; then
                  master_host="$discovered"
                  break
                fi
                sleep 1
              done
              ordinal="${HOSTNAME##*-}"
              master_arg=""
              if [ "$master_host" != "$HOSTNAME" ] && [ "$master_host" != "$HOSTNAME.redis" ] && [ "$master_host" != "redis-$ordinal.redis" ]; then
                master_arg="--replicaof $master_host 6379"
              fi
              exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD" $master_arg
          ports: [{name: redis, containerPort: 6379}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: REDIS_PASSWORD}}
          readinessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: redis-data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: redis-data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: sre-platform
spec:
  clusterIP: None
  selector: {app: redis-sentinel}
  ports: [{name: sentinel, port: 26379, targetPort: 26379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: sre-platform
spec:
  serviceName: redis-sentinel
  replicas: 3
  selector:
    matchLabels: {app: redis-sentinel}
  template:
    metadata:
      labels: {app: redis-sentinel}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sentinel
          image: redis:7.4-alpine
          command: ["sh", "-ec"]
          args:
            - |
              cat >/tmp/sentinel.conf <<EOF
              sentinel resolve-hostnames yes
              sentinel monitor mymaster redis-0.redis 6379 2
              sentinel auth-pass mymaster $REDIS_PASSWORD
              sentinel down-after-milliseconds mymaster 5000
              sentinel failover-timeout mymaster 10000
              sentinel parallel-syncs mymaster 1
              EOF
              exec redis-sentinel /tmp/sentinel.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: REDIS_PASSWORD}}
          ports: [{name: sentinel, containerPort: 26379}]
          readinessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -p 26379 ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: sre-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9121"
spec:
  selector: {app: redis-exporter}
  ports: [{name: metrics, port: 9121, targetPort: 9121}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: sre-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis-exporter}
  template:
    metadata:
      labels: {app: redis-exporter}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.67.4
          args: ["--redis.addr=redis://redis-0.redis:6379"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: REDIS_PASSWORD}}
          ports: [{name: metrics, containerPort: 9121}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}

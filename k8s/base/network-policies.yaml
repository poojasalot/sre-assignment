apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sre-platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-python-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: python-token-service}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{protocol: TCP, port: 8000}]
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-go-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: go-token-service}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: python-token-service}}
      ports: [{protocol: TCP, port: 50051}]
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 9090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: otel-collector}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: python-token-service}}
        - podSelector: {matchLabels: {app: go-token-service}}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-metrics-scrape
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: otel-collector}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 8888}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: prometheus}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: grafana}}
      ports: [{protocol: TCP, port: 9090}]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-backends-ingress
  namespace: sre-platform
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [loki, tempo]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: otel-collector}}
        - podSelector: {matchLabels: {app: grafana}}
      ports:
        - {protocol: TCP, port: 3100}
        - {protocol: TCP, port: 3200}
        - {protocol: TCP, port: 4317}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: grafana}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: sre-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: sre-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-python-egress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: python-token-service}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - {key: cnpg.io/cluster, operator: In, values: [postgres]}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector: {matchLabels: {app: go-token-service}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - podSelector: {matchLabels: {app: otel-collector}}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-go-egress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: go-token-service}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: redis}}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector: {matchLabels: {app: redis-sentinel}}
      ports: [{protocol: TCP, port: 26379}]
    - to:
        - podSelector: {matchLabels: {app: otel-collector}}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-egress
  namespace: sre-platform
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [prometheus, grafana, otel-collector]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [python-token-service, go-token-service, otel-collector, redis-exporter]}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8888}
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9121}
    - to:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [prometheus, loki, tempo, alertmanager]}
      ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 3100}
        - {protocol: TCP, port: 3200}
        - {protocol: TCP, port: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-exporter-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: redis-exporter}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 9121}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-exporter-egress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: redis-exporter}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: redis}}
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ha-ingress
  namespace: sre-platform
spec:
  podSelector:
    matchExpressions:
      - {key: cnpg.io/cluster, operator: In, values: [postgres]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: python-token-service}}
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - podSelector:
            matchExpressions:
              - {key: job-name, operator: Exists}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sentinel-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: redis-sentinel}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: go-token-service}}
        - podSelector: {matchLabels: {app: redis-sentinel}}
      ports: [{protocol: TCP, port: 26379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: alertmanager}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{protocol: TCP, port: 9093}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migration-egress
  namespace: sre-platform
spec:
  podSelector:
    matchExpressions:
      - {key: job-name, operator: Exists}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - {key: cnpg.io/cluster, operator: In, values: [postgres]}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ha-ingress
  namespace: sre-platform
spec:
  podSelector: {matchLabels: {app: redis}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: go-token-service}}
        - podSelector: {matchLabels: {app: redis}}
        - podSelector: {matchLabels: {app: redis-sentinel}}
        - podSelector: {matchLabels: {app: redis-exporter}}
      ports: [{protocol: TCP, port: 6379}]

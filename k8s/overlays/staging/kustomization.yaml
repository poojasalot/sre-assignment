# Multi-node cluster: base HA topology (3 PostgreSQL instances, Redis + Sentinel on separate nodes).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-platform-staging
resources:
  - ../../platform
  - ../../apps/python-service
  - ../../apps/go-service
# Promote immutable tags (e.g. the git SHA built by CI), never a moving tag.
images:
  - {name: ghcr.io/your-org/sre-python-service, newTag: 1.0.0}
  - {name: ghcr.io/your-org/sre-go-service, newTag: 1.0.0}
patches:
  - target: {kind: ConfigMap, name: platform-config}
    patch: |-
      - {op: replace, path: /data/DEPLOYMENT_ENVIRONMENT, value: staging}

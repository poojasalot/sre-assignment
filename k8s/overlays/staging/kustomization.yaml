apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-platform-staging
resources:
  - ../../platform
  - ../../apps/python-service
  - ../../apps/go-service
replicas:
  - name: python-token-service
    count: 2
  - name: go-token-service
    count: 2
images:
  - name: ghcr.io/your-org/sre-python-service
    newTag: staging
  - name: ghcr.io/your-org/sre-go-service
    newTag: staging

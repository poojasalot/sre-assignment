apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-token-service
  namespace: sre-platform
spec:
  template:
    spec:
      containers:
        - name: go-service
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-token-service
  namespace: sre-platform
spec:
  template:
    spec:
      containers:
        - name: python-service
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: sre-platform
spec:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-token-service
  namespace: sre-platform
spec:
  minReplicas: 1
  maxReplicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-token-service
  namespace: sre-platform
spec:
  minReplicas: 1
  maxReplicas: 3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sre-platform
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
        - name: redis-exporter
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: sre-platform
spec:
  template:
    spec:
      containers:
        - name: sentinel
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: sre-platform
spec:
  template:
    spec:
      containers:
        - name: collector
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: apps/v1

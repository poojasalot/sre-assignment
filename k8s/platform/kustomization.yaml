apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-platform
resources:
  - ../base/namespace.yaml
  - ../base/config.yaml
  - ../base/postgres.yaml
  - ../base/redis.yaml
  - ../base/database-migration.yaml
  - ../base/observability.yaml
  - ../base/observability-storage.yaml
  - ../base/network-policies.yaml
configMapGenerator:
  - name: token-db-init
    files:
      - database-init.sql=../base/config-files/database-init.sql
  - name: otel-collector-config
    files:
      - collector.yaml=../base/config-files/collector.yaml
  - name: loki-config
    files:
      - loki.yaml=../base/config-files/loki.yaml
  - name: tempo-config
    files:
      - tempo.yaml=../base/config-files/tempo.yaml
  - name: prometheus-config
    files:
      - prometheus.yml=../base/config-files/prometheus.yml
  - name: prometheus-alert-rules
    files:
      - alert-rules.yml=../base/config-files/alert-rules.yml
  - name: grafana-datasources
    files:
      - datasources.yaml=../base/config-files/datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yaml=../base/config-files/dashboards.yaml
  - name: grafana-dashboard-data
    files:
      - sre-token-platform.json=../base/config-files/sre-token-platform.json
generatorOptions:
  disableNameSuffixHash: false

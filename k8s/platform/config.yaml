apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: sre-platform
data:
  TOKEN_SERVICE_HOST: go-service:50051
  TOKEN_TTL_SECONDS: "3600"
  DB_POOL_MIN: "1"
  DB_POOL_MAX: "8"
  GRPC_TIMEOUT_SECONDS: "3"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  DEPLOYMENT_ENVIRONMENT: kubernetes
  SERVICE_VERSION: "1.0.0"
  REDIS_SENTINEL_MASTER: mymaster
  REDIS_SENTINELS: redis-sentinel-0.redis-sentinel:26379,redis-sentinel-1.redis-sentinel:26379,redis-sentinel-2.redis-sentinel:26379

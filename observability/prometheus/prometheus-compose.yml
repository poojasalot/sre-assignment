global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert-rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["prometheus:9090"]}]
  - job_name: python-token-service
    metrics_path: /metrics
    static_configs: [{targets: ["python-service:8000"]}]
  - job_name: go-token-service
    metrics_path: /metrics
    static_configs: [{targets: ["go-service:9090"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: redis-exporter
    static_configs: [{targets: ["redis-exporter:9121"]}]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

groups:
  - name: service-availability
    interval: 30s
    rules:
      - alert: PythonServiceTargetDown
        expr: up{job="python-token-service"} == 0
        for: 2m
        labels: {severity: critical, team: sre}
        annotations:
          summary: Python token API target is down
          description: Prometheus has been unable to scrape the Python service for more than 2 minutes.
      - alert: GoServiceTargetDown
        expr: up{job="go-token-service"} == 0
        for: 2m
        labels: {severity: critical, team: sre}
        annotations:
          summary: Go token gRPC service metrics target is down
          description: Prometheus has been unable to scrape the Go service for more than 2 minutes.
      - alert: PythonAvailabilityFastBurn
        expr: (sum(rate(http_server_requests_total{job="python-token-service",status_code=~"5.."}[1h])) / clamp_min(sum(rate(http_server_requests_total{job="python-token-service"}[1h])), 0.001) > 0.0144) and (sum(rate(http_server_requests_total{job="python-token-service",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_total{job="python-token-service"}[5m])), 0.001) > 0.0144)
        for: 2m
        labels: {severity: critical, team: sre, slo: availability}
        annotations:
          summary: Python API is rapidly burning its availability error budget
          description: For a provisional 99.9% availability SLO, the 1h and 5m error ratios both exceed a 14.4x burn rate.
      - alert: PythonAvailabilitySlowBurn
        expr: (sum(rate(http_server_requests_total{job="python-token-service",status_code=~"5.."}[6h])) / clamp_min(sum(rate(http_server_requests_total{job="python-token-service"}[6h])), 0.001) > 0.006) and (sum(rate(http_server_requests_total{job="python-token-service",status_code=~"5.."}[30m])) / clamp_min(sum(rate(http_server_requests_total{job="python-token-service"}[30m])), 0.001) > 0.006)
        for: 10m
        labels: {severity: warning, team: sre, slo: availability}
        annotations:
          summary: Python API is slowly burning its availability error budget
          description: The 6h and 30m error ratios both exceed a 6x burn rate for a provisional 99.9% SLO.
      - alert: GoGrpcAvailabilityFastBurn
        expr: (sum(rate(grpc_server_requests_total{job="go-token-service",status=~"Internal|Unavailable|DeadlineExceeded|Unknown|ResourceExhausted"}[1h])) / clamp_min(sum(rate(grpc_server_requests_total{job="go-token-service"}[1h])), 0.001) > 0.0144) and (sum(rate(grpc_server_requests_total{job="go-token-service",status=~"Internal|Unavailable|DeadlineExceeded|Unknown|ResourceExhausted"}[5m])) / clamp_min(sum(rate(grpc_server_requests_total{job="go-token-service"}[5m])), 0.001) > 0.0144)
        for: 2m
        labels: {severity: critical, team: sre, slo: availability}
        annotations:
          summary: Go token service is rapidly burning its availability error budget
          description: gRPC server error ratio exceeds the 14.4x burn-rate threshold in both 1h and 5m windows.
      - alert: PythonHigh5xxRate
        expr: (sum(rate(http_server_requests_total{job="python-token-service",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_total{job="python-token-service"}[5m])), 0.001)) > 0.02
        for: 5m
        labels: {severity: warning, team: sre}
        annotations:
          summary: Python API 5xx ratio above 2%
          description: More than 2% of Python API requests returned 5xx for 5 minutes.
      - alert: PythonHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="python-token-service"}[5m]))) > 0.5
        for: 10m
        labels: {severity: warning, team: sre}
        annotations:
          summary: Python API p95 latency above 500ms
          description: p95 latency exceeded 500ms for 10 minutes.
      - alert: GoGrpcHighErrorRate
        expr: (sum(rate(grpc_server_requests_total{job="go-token-service",status!="OK"}[5m])) / clamp_min(sum(rate(grpc_server_requests_total{job="go-token-service"}[5m])), 0.001)) > 0.02
        for: 5m
        labels: {severity: warning, team: sre}
        annotations:
          summary: Go gRPC non-OK ratio above 2%
          description: More than 2% of gRPC responses were non-OK for 5 minutes; inspect client errors separately from server failures.
      - alert: DatabasePoolNearExhaustion
        expr: db_pool_connections_in_use{job="python-token-service"} / clamp_min(db_pool_connections_max{job="python-token-service"}, 1) > 0.8
        for: 5m
        labels: {severity: warning, team: sre}
        annotations:
          summary: PostgreSQL connection pool above 80% utilisation
          description: Pool saturation may cause request queueing and acquisition timeouts.
      - alert: DatabasePoolAcquireFailures
        expr: increase(db_pool_acquire_errors_total{job="python-token-service"}[5m]) > 0
        for: 1m
        labels: {severity: critical, team: sre}
        annotations:
          summary: PostgreSQL connection pool acquisition is timing out
          description: At least one connection acquisition timed out in the last 5 minutes.
      - alert: RedisOperationP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(redis_operation_duration_seconds_bucket{job="go-token-service"}[5m]))) > 0.05
        for: 10m
        labels: {severity: warning, team: sre}
        annotations:
          summary: Redis operation p95 above 50ms
          description: Redis operation latency exceeded 50ms for 10 minutes.
      - alert: RedisPoolAcquisitionTimeouts
        expr: increase(redis_pool_timeouts_total{job="go-token-service"}[5m]) > 0
        for: 1m
        labels: {severity: warning, team: sre}
        annotations:
          summary: Redis client pool acquisition timeouts detected
          description: Redis pool acquisition timeouts increased in the last 5 minutes; inspect connection saturation and downstream latency.
      - alert: TokenMintFailureSpike
        expr: (sum(rate(tokens_minted_total{job="go-token-service",status="error"}[5m])) / clamp_min(sum(rate(tokens_minted_total{job="go-token-service"}[5m])), 0.001)) > 0.01
        for: 5m
        labels: {severity: critical, team: sre}
        annotations:
          summary: Token mint failures above 1%
          description: More than 1% of token mint attempts failed for 5 minutes.

# Kubernetes scrape configuration. Discovery is limited to Prometheus' own namespace so every
# environment (dev/staging/production) only sees its own targets. Job names match the Compose
# configuration so the alert rules and dashboard work unchanged in both.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus-rules/alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  # Services annotated prometheus.io/scrape=true, restricted to their named metrics port.
  - job_name: kubernetes-services
    kubernetes_sd_configs:
      - role: endpoints
        namespaces: {own_namespace: true}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: python-service;http|go-service;metrics|otel-collector;telemetry|redis;metrics
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_service_name]
        target_label: job
      - source_labels: [__meta_kubernetes_service_name]
        regex: python-service
        target_label: job
        replacement: python-token-service
      - source_labels: [__meta_kubernetes_service_name]
        regex: go-service
        target_label: job
        replacement: go-token-service
      - source_labels: [__meta_kubernetes_service_name]
        regex: redis
        target_label: job
        replacement: redis-exporter
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # CloudNativePG instance exporters (container port "metrics", 9187).
  - job_name: cnpg
    kubernetes_sd_configs:
      - role: pod
        namespaces: {own_namespace: true}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster, __meta_kubernetes_pod_container_port_name]
        action: keep
        regex: postgres;metrics
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

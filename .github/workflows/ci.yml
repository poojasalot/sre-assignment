name: ci
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  # Config validators run from the same images the stack deploys, so CI checks the versions we ship.
  PROMETHEUS_IMAGE: prom/prometheus:v3.16.0
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.28.1
  OTELCOL_IMAGE: otel/opentelemetry-collector-contrib:0.165.0
  KUBECONFORM_VERSION: v0.8.0

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt
      - run: python -m pip install -r python-service/requirements-dev.txt
      - run: python -m pytest -q

  golang:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: golang-service/go.sum
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config, rules and rule unit tests
        run: |
          promtool() { docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"; }
          promtool check config --syntax-only observability/prometheus/prometheus-compose.yml
          promtool check config --syntax-only observability/prometheus/prometheus-k8s.yml
          promtool check rules observability/prometheus/alert-rules.yml
          promtool test rules observability/prometheus/alert-rules.test.yml
      - name: Alertmanager config
        run: docker run --rm -v "$PWD:/w" -w /w --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config observability/alertmanager/alertmanager.yml
      - name: OpenTelemetry Collector config
        run: docker run --rm -v "$PWD:/w" "$OTELCOL_IMAGE" validate --config=/w/observability/otel/collector.yaml
      - name: Grafana JSON
        run: python3 -m json.tool observability/grafana/dashboards/sre-token-platform.json >/dev/null

  k8s-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
      - name: Render every Kustomize root
        run: |
          mkdir -p rendered
          for root in platform apps/python-service apps/go-service overlays/dev overlays/staging overlays/production; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone "k8s/$root" > "rendered/${root//\//-}.yaml"
          done
      - name: Validate against Kubernetes and CRD (CloudNativePG, Argo CD) schemas
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml k8s/argocd-application.example.yaml

  containers:
    runs-on: ubuntu-latest
    needs: [python, golang]
    strategy:
      matrix:
        service: [python-service, golang-service]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: error
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: sre-${{ matrix.service }}:ci
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: sre-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  integration:
    runs-on: ubuntu-latest
    needs: [python, golang]
    steps:
      - uses: actions/checkout@v4
      - name: Create test environment
        run: |
          cp .env.example .env
          sed -i 's/change-me-local-only/ci-only-secret/' .env
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Trace and log correlation (Tempo + Loki)
        run: ./scripts/validate-observability.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  kind-e2e:
    runs-on: ubuntu-latest
    needs: [k8s-validation, containers]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Deploy dev overlay to kind and run end-to-end checks
        run: ./scripts/kind-e2e.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

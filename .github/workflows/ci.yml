name: ci
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r python-service/requirements-dev.txt
      - run: python -m pytest -q python-service/tests
  golang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: golang-service/go.sum
      - run: cd golang-service && go test ./...
      - run: cd golang-service && go vet ./...
  containers:
    runs-on: ubuntu-latest
    needs: [python, golang]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./python-service
          push: false
          tags: sre-python-service:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./golang-service
          push: false
          tags: sre-go-service:ci
  k8s-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render all roots
        run: |
          kubectl kustomize k8s/base >/tmp/base.yaml
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/platform >/tmp/platform.yaml
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/apps/python-service >/tmp/python.yaml
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/apps/go-service >/tmp/go.yaml
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/dev >/tmp/dev.yaml
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/staging >/tmp/staging.yaml
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/production >/tmp/production.yaml
      - name: Validate Kubernetes resources
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: -strict -summary -ignore-missing-schemas /tmp/base.yaml /tmp/platform.yaml /tmp/python.yaml /tmp/go.yaml /tmp/dev.yaml /tmp/staging.yaml /tmp/production.yaml
  integration:
    runs-on: ubuntu-latest
    needs: [python, golang]
    steps:
      - uses: actions/checkout@v4
      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=tokendb
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          GRAFANA_ADMIN_PASSWORD=ci-grafana-password
          EOF
      - name: Start stack
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    runs-on: ubuntu-latest
    needs: [python, golang]
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
